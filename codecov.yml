# Codecov settings; see https://docs.codecov.com/docs/codecovyml-reference
codecov:
  notify:
    # Wait for coverage from every CI job (see .github/workflows/build.yml)
    # before reporting, so that early partial results aren't misleading:
    # unit test coverage from 6 jobs, and end-to-end from 5
    after_n_builds: 11

coverage:
  status:
    project:
      default:
        # Report overall coverage, but don't fail on it (yet)
        informational: true
    patch:
      default:
        # Most new or changed lines should be covered by tests
        target: 80%

comment:
  layout: "diff, flags, files"

ignore:
  - "src/plugins"
  - "tests"
